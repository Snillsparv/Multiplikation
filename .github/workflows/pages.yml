name: Publicera till GitHub Pages

on:
  push:
    branches: [claude/youthful-darwin-y1v13b, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Aktivera och konfigurera Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Ladda upp sidan
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
